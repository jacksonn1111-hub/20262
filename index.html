<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2학기 교과별 평가계획 확인</title>
<style>
  :root{--navy:#1B3A6B;--navy-d:#142C52;--line:#E2E6ED;--ink:#1E2530;
    --muted:#6B7480;--bg:#F4F6F9;--done:#F3FAF5;--done-fg:#22794F;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;}
  header{background:var(--navy);color:#fff;padding:22px 20px 20px}
  .wrap{max-width:900px;margin:0 auto}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  header p{margin:6px 0 0;font-size:13.5px;color:#C3D0E6}
  .hbar{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .hbar input{padding:8px 11px;font-size:13.5px;border:none;border-radius:7px;width:240px;max-width:100%;background:#fff;color:var(--ink)}
  .sync{font-size:12px;color:#AFC0DC}
  main{max-width:900px;margin:0 auto;padding:22px 20px 60px}
  .gcard{display:block;width:100%;text-align:left;padding:18px 20px;border:1px solid var(--line);
    border-radius:10px;background:#fff;cursor:pointer;margin-bottom:12px;font:inherit;color:inherit}
  .gcard:hover{border-color:var(--navy)}
  .gtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .gname{font-size:19px;font-weight:700}
  .gnum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .bar{margin-top:12px;height:5px;background:#EDF0F4;border-radius:3px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--navy);transition:width .3s}
  .bar>i.full{background:#3F9E6B}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .back{background:none;border:none;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer;padding:0;font-family:inherit}
  .back:hover{text-decoration:underline}
  .search{width:100%;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:8px;
    margin-bottom:14px;background:#fff;color:var(--ink);font-family:inherit}
  .list{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .item+.item{border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#fff}
  .row.done{background:var(--done)}
  .row:hover{background:#F7F9FC}
  .row.done:hover{background:#EDF7F1}
  .rowbtn{flex:1;display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;
    text-align:left;padding:0;min-width:0;font-family:inherit;color:inherit}
  .idx{font-size:12px;color:var(--muted);width:22px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .sname{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:11.5px;padding:2px 7px;border-radius:4px;flex-shrink:0;font-weight:600}
  .cred{font-size:12.5px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
  .donetxt{font-size:12px;color:var(--done-fg);font-weight:700;flex-shrink:0}
  .chk{width:26px;height:26px;flex-shrink:0;border-radius:6px;cursor:pointer;border:1.5px solid #C7CDD6;
    background:#fff;color:#fff;font-size:14px;line-height:1;padding:0}
  .chk:hover{border-color:var(--navy)}
  .chk.on{background:#2E8B57;border:none}
  .meta{padding:0 14px 11px 46px;font-size:12px;color:var(--muted);background:#fff}
  .meta.done{background:var(--done)}
  .editor{padding:4px 14px 18px;background:#FAFBFC;border-top:1px solid var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
  label span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .grid input,.editor textarea{width:100%;padding:8px 10px;font-size:14px;border:1px solid var(--line);
    border-radius:6px;background:#fff;color:var(--ink);font-family:inherit;font-variant-numeric:tabular-nums}
  .editor textarea{resize:vertical}
  .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .primary{padding:9px 18px;font-size:14px;font-weight:600;color:#fff;background:var(--navy);border:none;
    border-radius:7px;cursor:pointer;font-family:inherit}
  .primary:hover{background:var(--navy-d)}
  .primary[disabled]{opacity:.6;cursor:default}
  .ghost{padding:9px 14px;font-size:14px;color:var(--muted);background:none;border:1px solid var(--line);
    border-radius:7px;cursor:pointer;font-family:inherit}
  .empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
  .notice{background:#FFF6E0;border:1px solid #F0DCA8;color:#7A5B12;padding:11px 14px;border-radius:8px;
    font-size:13px;margin-bottom:16px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22303F;color:#fff;
    padding:10px 18px;border-radius:8px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:50}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
  @media (max-width:520px){.cred,.tag{display:none}}
</style>
</head>

    <div class="hbar">
      <input id="teacher" placeholder="이름 (수정·확인 시 기록됩니다)">

    </div>
  </div>
</header>
<main id="app"></main>

  BASE[g] = RAW[g].map(function(row, i){
    const o = { id:"g"+g+"-"+i, grade:g, memo:"" };
    F.forEach(function(k, j){ o[k] = row[j] || ""; });
    return o;
  });
}
const ALL = [].concat(BASE[1], BASE[2], BASE[3]);

const TINT = {"보통":["#E7EDF8","#264C86"],"전공":["#FCEFE2","#8A5320"],
  "전문":["#E6F1EE","#1F6355"],"교양":["#EEEAF7","#54418F"]};
function tint(c){ return TINT[String(c||"").split("-")[0]] || ["#EEF0F3","#6B7480"]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }
function pad(n){ return String(n).padStart(2,"0"); }
function stamp(){ const d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function clock(){ const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }

/* ── 상태 ── */
const S = { grade:null, remote:{}, open:null, draft:null, q:"", busy:false };
const app = document.getElementById("app");
const syncEl = document.getElementById("sync");
const teacherEl = document.getElementById("teacher");
teacherEl.value = localStorage.getItem("evalplan.teacher") || "";
teacherEl.addEventListener("input", function(){ localStorage.setItem("evalplan.teacher", teacherEl.value); });

let toastT;
function toast(msg){
  clearTimeout(toastT);
  let el = document.querySelector(".toast");
  if(!el){ el=document.createElement("div"); el.className="toast"; document.body.appendChild(el); }
  el.textContent = msg;
  toastT = setTimeout(function(){ el.remove(); }, 2200);
}

/* ── 저장소 (구글 시트 / 연습 모드) ── */
const LIVE = !!API_URL;

async function pull(){
  if (!LIVE){
    S.remote = JSON.parse(localStorage.getItem("evalplan.rows") || "{}");
    syncEl.textContent = "연습 모드 — 이 브라우저에만 저장됩니다";
    return;
  }
  const res = await fetch(API_URL + "?action=all&t=" + Date.now());
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  S.remote = json.rows || {};
  syncEl.textContent = "최신 상태 " + clock();
  if (Object.keys(S.remote).length === 0) await seed();
}

/* 시트가 비어 있으면 원본 57과목을 한 번 채워 넣습니다 */
async function seed(){
  const rows = ALL.map(function(s){
    const o = { id:s.id, grade:s.grade, memo:"" };
    F.forEach(function(k){ o[k] = s[k]; });
    return o;
  });
  await post({ action:"init", rows: rows });
  const res = await fetch(API_URL + "?action=all&t=" + Date.now());
  const json = await res.json();
  S.remote = json.rows || {};
}

async function post(payload){
  if (!LIVE){
    const cur = JSON.parse(localStorage.getItem("evalplan.rows") || "{}");
    if (payload.action === "init") payload.rows.forEach(function(r){ cur[r.id] = r; });
    else cur[payload.id] = Object.assign({}, cur[payload.id], payload.entry);
    localStorage.setItem("evalplan.rows", JSON.stringify(cur));
    S.remote = cur;
    return { ok:true };
  }
  /* Content-Type을 지정하지 않아야 Apps Script가 사전 요청 없이 받습니다 */
  const res = await fetch(API_URL, { method:"POST", body: JSON.stringify(payload) });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

async function push(id, entry, msg){
  S.busy = true; syncEl.textContent = "저장 중…";
  try{
    await post({ action:"save", id:id, entry:entry });
    S.remote[id] = Object.assign({}, S.remote[id], entry);
    syncEl.textContent = "최신 상태 " + clock();
    toast(msg);
    return true;
  }catch(e){
    syncEl.textContent = "저장에 실패했습니다";
    toast("저장하지 못했습니다. 잠시 후 다시 시도해 주세요.");
    return false;
  }finally{ S.busy = false; }
}

/* 7초마다 다른 선생님의 수정 내용을 가져옵니다. 수정 중일 때는 화면을 다시 그리지 않습니다 */
setInterval(async function(){
  if (!LIVE || S.busy || S.open) return;
  try{ await pull(); render(); }
  catch(e){ syncEl.textContent = "연결에 실패했습니다"; }
}, 7000);

/* ── 데이터 결합 ── */
function merged(g){
  return BASE[g].map(function(s){
    const r = S.remote[s.id] || null;
    const o = Object.assign({}, s);
    if (r) F.concat(["memo"]).forEach(function(k){
      if (r[k] !== undefined && r[k] !== null && r[k] !== "") o[k] = String(r[k]);
    });
    o._m = r;
    return o;
  });
}
function counts(g){
  return { done: BASE[g].filter(function(s){ return S.remote[s.id] && S.remote[s.id].done; }).length,
           total: BASE[g].length };
}

/* ── 화면 ── */
function render(){
  app.innerHTML = S.grade ? viewList() : viewGrades();
  bind();
}

function viewGrades(){
  const warn = !LIVE ? '<div class="notice">지금은 <b>연습 모드</b>입니다. 수정한 내용이 이 브라우저에만 남고 다른 선생님에게는 보이지 않습니다. index.html 위쪽 <b>API_URL</b> 에 Apps Script 주소를 넣으면 공유가 켜집니다.</div>' : "";
  return warn + '<p style="color:var(--muted);font-size:14px;margin:0 0 18px">담당 학년을 선택하면 과목 목록이 열립니다.</p>' +
    [1,2,3].map(function(g){
      const c = counts(g), pct = Math.round(c.done / c.total * 100);
      return '<button class="gcard" data-grade="'+g+'"><div class="gtop"><div class="gname">'+g+'학년</div>'+
        '<div class="gnum">확인 '+c.done+' / '+c.total+'과목</div></div>'+
        '<div class="bar"><i class="'+(pct===100?"full":"")+'" style="width:'+pct+'%"></i></div></button>';
    }).join("");
}

function viewList(){
  const g = S.grade, c = counts(g), q = S.q.trim();
  const rows = merged(g).map(function(s,i){ return [s,i]; })
    .filter(function(p){ return !q || p[0].name.indexOf(q) >= 0 || p[0].cat.indexOf(q) >= 0; });
  const body = rows.length === 0
    ? '<div class="empty">찾는 과목이 없습니다. 검색어를 지워 보세요.</div>'
    : rows.map(function(p){ return item(p[0], p[1]); }).join("");
  return '<div class="topbar"><button class="back" id="back">← 학년 다시 선택</button>'+
    '<span class="gnum">'+g+'학년 · 확인 '+c.done+'/'+c.total+'</span></div>'+
    '<input class="search" id="q" placeholder="과목명으로 찾기" value="'+esc(S.q)+'">'+
    '<div class="list">'+body+'</div>';
}

function item(s, i){
  const done = !!(s._m && s._m.done), t = tint(s.cat), open = S.open === s.id;
  const meta = [
    s._m && s._m.checkedBy ? esc(s._m.checkedBy)+" 확인 "+esc(s._m.checkedAt||"") : "",
    s._m && s._m.updatedBy ? esc(s._m.updatedBy)+" 수정 "+esc(s._m.updatedAt||"") : ""
  ].filter(Boolean).join(" · ");
  return '<div class="item"><div class="row '+(done?"done":"")+'">'+
    '<button class="rowbtn" data-open="'+s.id+'"><span class="idx">'+(i+1)+'</span>'+
    '<span class="sname">'+esc(s.name)+'</span>'+
    '<span class="tag" style="background:'+t[0]+';color:'+t[1]+'">'+esc(s.cat)+'</span>'+
    '<span class="cred">'+esc(s.credits)+'</span></button>'+
    (done?'<span class="donetxt">확인 완료</span>':"")+
    '<button class="chk '+(done?"on":"")+'" data-chk="'+s.id+'" aria-label="확인 완료 표시">'+(done?"✓":"")+'</button>'+
    '</div>'+
    (open ? editor(s) : (meta ? '<div class="meta '+(done?"done":"")+'">'+meta+'</div>' : ""))+
    '</div>';
}

function editor(s){
  const d = S.draft;
  return '<div class="editor"><div class="grid">'+
    F.map(function(k){ return '<label><span>'+LABELS[k]+'</span><input data-f="'+k+'" value="'+esc(d[k])+'"></label>'; }).join("")+
    '</div><label><span>수정 사유 · 남길 말</span><textarea data-f="memo" rows="2">'+esc(d.memo)+'</textarea></label>'+
    '<div class="acts"><button class="primary" data-save="'+s.id+'">수정 내용 저장</button>'+
    '<button class="ghost" data-cancel="1">취소</button>'+
    (s._m && s._m.updatedBy ? '<span class="gnum">최근 수정 '+esc(s._m.updatedBy)+' · '+esc(s._m.updatedAt||"")+'</span>' : "")+
    '</div></div>';
}

function bind(){
  app.querySelectorAll("[data-grade]").forEach(function(b){
    b.onclick = function(){ S.grade = +b.dataset.grade; S.open=null; S.q=""; render(); }; });

  const back = document.getElementById("back");
  if (back) back.onclick = function(){ S.grade=null; S.open=null; S.draft=null; render(); };

  const q = document.getElementById("q");
  if (q) q.oninput = function(e){
    S.q = e.target.value; const p = e.target.selectionStart; render();
    const n = document.getElementById("q"); n.focus(); n.setSelectionRange(p,p); };

  app.querySelectorAll("[data-open]").forEach(function(b){
    b.onclick = function(){
      const id = b.dataset.open;
      if (S.open === id){ S.open=null; S.draft=null; }
      else {
        const s = merged(S.grade).filter(function(x){ return x.id===id; })[0];
        S.open = id; S.draft = Object.assign({}, s);
      }
      render();
    }; });

  app.querySelectorAll("[data-f]").forEach(function(el){
    el.oninput = function(){ S.draft[el.dataset.f] = el.value; }; });

  app.querySelectorAll("[data-cancel]").forEach(function(b){
    b.onclick = function(){ S.open=null; S.draft=null; render(); }; });

  app.querySelectorAll("[data-save]").forEach(function(b){
    b.onclick = async function(){
      const name = teacherEl.value.trim();
      if (!name){ toast("이름을 먼저 입력해 주세요."); teacherEl.focus(); return; }
      b.disabled = true; b.textContent = "저장 중…";
      const entry = { updatedBy:name, updatedAt:stamp(), memo:S.draft.memo || "" };
      F.forEach(function(k){ entry[k] = S.draft[k] || ""; });
      const ok = await push(b.dataset.save, entry, "저장했습니다.");
      if (ok){ S.open=null; S.draft=null; }
      render();
    }; });

  app.querySelectorAll("[data-chk]").forEach(function(b){
    b.onclick = async function(){
      const id = b.dataset.chk, cur = !!(S.remote[id] && S.remote[id].done);
      const name = teacherEl.value.trim();
      if (!cur && !name){ toast("이름을 먼저 입력해 주세요."); teacherEl.focus(); return; }
      b.disabled = true;
      await push(id, cur ? { done:false, checkedBy:"", checkedAt:"" }
                         : { done:true, checkedBy:name, checkedAt:stamp() },
                 cur ? "확인 완료를 해제했습니다." : "확인 완료로 표시했습니다.");
      render();
    }; });
}

/* ── 시작 ── */
(async function(){
  if (ACCESS_CODE && localStorage.getItem("evalplan.code") !== ACCESS_CODE){
    const v = prompt("접속 코드를 입력해 주세요.");
    if (v === ACCESS_CODE) localStorage.setItem("evalplan.code", v);
    else { document.body.innerHTML = "<main class='wrap' style='padding:40px 20px'>접속 코드가 맞지 않습니다.</main>"; return; }
  }
  try { await pull(); }
  catch(e){ syncEl.textContent = "불러오지 못했습니다"; }
  render();
})();
</script>
</body>
</html>
